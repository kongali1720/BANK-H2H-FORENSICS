name: BANK-H2H-FORENSICS CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality Checks - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip setuptools filelock

      - name: Install project and development tools
        run: |
          python -m pip install -e .
          python -m pip install pytest ruff build pip-audit
          python -m pip install --upgrade setuptools
          python -m pip install --upgrade "filelock>=4.2.1"

      - name: Verify security dependency versions
        run: |
          python -m pip show filelock setuptools
          python -c "from filelock import __version__; print('filelock version:', __version__); assert tuple(map(int, __version__.split('.'))) >= (4, 2, 1), 'filelock must be >= 4.2.1'"

      - name: Ruff lint
        run: ruff check bank_h2h_forensics tests

      - name: Ruff format check
        run: ruff format --check bank_h2h_forensics tests

      - name: Run tests
        run: python -m pytest -v

      - name: Build distribution packages
        run: python -m build

      - name: Dependency security audit
        run: pip-audit --skip-editable

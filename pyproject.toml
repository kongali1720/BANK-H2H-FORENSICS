[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-h2h-forensics"
version = "0.3.0"
description = "Financial file intelligence and transaction evidence analyzer"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Kongali1720"}]

[project.scripts]
bank-h2h-forensics = "bank_h2h_forensics.cli:main"

[tool.setuptools.packages.find]
include = ["bank_h2h_forensics*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
